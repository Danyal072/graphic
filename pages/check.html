<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Canvas with Gradient Border</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <canvas id="circleCanvas" width="300" height="300"></canvas>
    <script>
        window.onload = function() {
    const canvas = document.getElementById('circleCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const radius = width / 2 - 10; // Adjust the radius to fit within the canvas

    // Create a gradient
    const gradient = ctx.createLinearGradient(0, 0, width, height);
    gradient.addColorStop(0, 'red');
    gradient.addColorStop(1, 'blue');

    // Draw the circle using curves
    ctx.beginPath();
    const startAngle = 29.8;
    const endAngle = 6.49 * Math.PI;
    ctx.arc(width / 2, height / 2, radius, startAngle, endAngle);
    ctx.lineWidth = 10;
    ctx.strokeStyle = gradient;
    ctx.stroke();
};


    </script>
</body>
</html>
